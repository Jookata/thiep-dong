plugins {
    id 'com.android.application'
}

android {
    namespace 'com.jookata.thiepdong'
    compileSdk 36

    defaultConfig {
        applicationId 'com.jookata.thiepdong'
        minSdk 26
        targetSdk 36          // Google Play: app mới/bản cập nhật phải nhắm API 36 trở lên (từ 31/8/2026)
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            // Gói thiệp web (thư mục docs/ của repo) được nhúng vào app để "Xem thử" chạy offline
            // và luôn giống hệt trang người nhận sẽ thấy. Một nguồn duy nhất, không chép đôi.
            assets.srcDirs = ['src/main/assets', '../../docs']
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.google.android.gms:play-services-ads:23.6.0'
}
