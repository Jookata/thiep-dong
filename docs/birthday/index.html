<script>
(function(){
var $=function(id){return document.getElementById(id)};
var NS='http://www.w3.org/2000/svg';
var svg=$('scene');
function el(name,attrs,parent){var e=document.createElementNS(NS,name);for(var k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e}
function sleep(ms){return new Promise(function(r){setTimeout(r,ms)})}
var W=function(p,a){return el('g',a||{},p)};
function rnd3(){return 1+Math.floor(Math.random()*3)}

/* ================= TEXTS (i18n) ================= */
var T=WC.build(TX);
var PLAY='https://play.google.com/store/apps/details?id=com.jookata.thiepdong';
var q=new URLSearchParams(location.search);
var hasParams=q.has('to')||q.has('from')||q.has('lang');
var lang=WC.norm(q.get('lang'))||WC.norm(navigator.language)||'en';
var nameTo=(q.get('to')||'').trim().slice(0,30);
var nameFrom=(q.get('from')||'').trim().slice(0,30);
var custom=(q.has('m')?WC.dec(q.get('m')):(q.get('msg')||'')).trim().slice(0,160);
if(!hasParams){try{var sv=JSON.parse(localStorage.getItem('birthdayDemo')||'{}');nameTo=sv.to||'Lan';nameFrom=sv.from||'Minh';custom=(sv.msg||'').slice(0,160);lang=WC.norm(sv.lang)||'vi'}catch(e){nameTo='Lan';nameFrom='Minh';lang='vi'}}
if(!T[lang])lang='en';
function fmt(s){var t=T[lang];return s.replace(/\{to\}/g,function(){return nameTo||t.anon}).replace(/\{from\}/g,function(){return nameFrom})}
var DBG=q.has('dbg');
var T_HINT=(DBG&&+q.get('t90'))||90,T_RESET=(DBG&&+q.get('t120'))||120;

/* ================= HELPERS ================= */
var msg=$('msg'),msgText=$('msgText'),sayT=null,fx=$('fx');
function say(t){msg.style.opacity=0;clearTimeout(sayT);if(!t)return;sayT=setTimeout(function(){msgText.textContent=t;msg.style.opacity=1},260)}
function burst(x,y,col,n){n=n||12;
  for(var i=0;i<n;i++){
    var c=el('circle',{cx:x,cy:y,r:2.2,fill:col||'#ffe27a'},fx);
    var a=i/n*Math.PI*2,d=20+Math.random()*26;
    c.animate([{transform:'translate(0,0) scale(1)',opacity:1},{transform:'translate('+Math.cos(a)*d+'px,'+Math.sin(a)*d+'px) scale(.2)',opacity:0}],{duration:900,easing:'ease-out'}).onfinish=(function(n){return function(){n.remove()}})(c);
  }}
function anim(node,frames,opts){opts.fill='forwards';return node.animate(frames,opts).finished}

/* ================= SCENE ================= */
var BX=[62,180,298],BY=395,KIND=['pink','cream','lilac'];
var frame=1+Math.floor(Math.random()*3);
var boxes=[];
(function(){
  var g=$('boxesG'),hits=$('hits');
  KIND.forEach(function(k,i){
    var o=W(g,{transform:'translate('+BX[i]+' '+BY+')'}),wrap=W(o,{style:'opacity:0'});
    var body=el('image',{href:'assets/box_'+k+'.webp',x:-55,y:-92.5,width:110,height:92.5},wrap);
    var lidP=W(wrap,{transform:'translate(0 -40)'}),lid=W(lidP);el('image',{href:'assets/lid_'+k+'.webp',x:-53,y:-83,width:106,height:83},lid);
    el('rect',{'data-h':'b'+(i+1),class:'hs',x:BX[i]-56,y:BY-170,width:112,height:174},hits);
    boxes.push({g:o,wrap:wrap,body:body,lid:lid});
  });
})();
/* bánh + nến */
var CAKE_W=250,CAKE_B=470,cake={kind:'pink',h:0,top:0,cx:180};
var CANDLE_H=100,CANDLE_W=Math.round(CANDLE_H*96/520*10)/10,candleStart={x:304,y:540};
var CAKEIMG;var REL={pink:[.69,.404],cream:[.69,.378]};
var candleG=$('candleG'),cndIn=null,flameG=$('flameG');
(function(){
  cndIn=W(candleG,{style:'transform-origin:0 0'});
  el('ellipse',{cx:0,cy:-1,rx:12,ry:3.4,fill:'#5a3a20',opacity:.35},cndIn);
  el('image',{href:'assets/candle.webp',x:-CANDLE_W/2,y:-CANDLE_H,width:CANDLE_W,height:CANDLE_H},cndIn);
  var tw=el('g',{id:'twk'},cndIn);
  ['-3,-103,.0','4,-108,.5'].forEach(function(s){var p=s.split(',');var c=el('path',{d:'M0,-4 L1.2,-1.2 L4,0 L1.2,1.2 L0,4 L-1.2,1.2 L-4,0 L-1.2,-1.2Z',fill:'#fff6c0',transform:'translate('+p[0]+' '+p[1]+')',class:'tw'},tw);c.style.animationDelay=p[2]+'s'});
  /* ngọn lửa: gốc tại đầu tim nến */
  var fl=W(flameG,{id:'flameIn'});
  el('circle',{cx:0,cy:-9,r:24,fill:'url(#glowG)'},fl);
  var fb=W(fl,{class:'flick'});
  el('path',{d:'M0,-26 C5,-17 8,-11 8,-6 C8,-1 4,2 0,2 C-4,2 -8,-1 -8,-6 C-8,-11 -5,-17 0,-26Z',fill:'url(#flG)'},fb);
  el('path',{d:'M0,-13 C2.4,-9 3.6,-6 3.6,-3.6 C3.6,-1.4 1.8,0 0,0 C-1.8,0 -3.6,-1.4 -3.6,-3.6 C-3.6,-6 -2.4,-9 0,-13Z',fill:'#fffdf0',opacity:.95},fb);
})();
function cakeSetup(kind){
  cake.kind=kind;var G=$('cakeG');G.innerHTML='';
  var r=kind==='pink'?743/640:729/640;cake.h=CAKE_W*r;cake.top=CAKE_B-cake.h;
  el('image',{href:'assets/cake_'+kind+'.webp',x:180-CAKE_W/2,y:cake.top,width:CAKE_W,height:cake.h},G);
  cake.cx=180}
function candleTarget(){return {x:cake.cx-CAKE_W/2+REL[cake.kind][0]*CAKE_W,y:cake.top+REL[cake.kind][1]*cake.h+2}}

/* ================= AUDIO (WebAudio, không file) ================= */
var ac=null,master=null,muted=false,musicOn=false;
function initAudio(){
  if(ac)return;
  try{
    var C=window.AudioContext||window.webkitAudioContext;ac=new C();
    master=ac.createGain();master.gain.value=.5;
    var dl=ac.createDelay(1);dl.delayTime.value=.27;var fb=ac.createGain();fb.gain.value=.28;var wet=ac.createGain();wet.gain.value=.3;
    master.connect(ac.destination);master.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(wet);wet.connect(ac.destination);
  }catch(e){ac=null}
}
function tone(f,t,d,vol,type){
  var o=ac.createOscillator(),o2=ac.createOscillator(),g=ac.createGain(),g2=ac.createGain();
  o.type=type||'triangle';o.frequency.value=f;o2.type='sine';o2.frequency.value=f*2;g2.gain.value=.25;
  o.connect(g);o2.connect(g2);g2.connect(g);g.connect(master);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.start(t);o2.start(t);o.stop(t+d+.05);o2.stop(t+d+.05);
}
function chime(f){if(!ac||muted)return;try{var t=ac.currentTime;tone(f,t,.7,.2);tone(f*1.5,t+.09,.7,.14)}catch(e){}}
function noise(d,f){if(!ac||muted)return;try{var n=Math.floor(ac.sampleRate*d),b=ac.createBuffer(1,n,ac.sampleRate),a=b.getChannelData(0);for(var i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);var s=ac.createBufferSource();s.buffer=b;var fl=ac.createBiquadFilter();fl.type='bandpass';fl.frequency.value=f||1800;var g=ac.createGain();g.gain.value=.5;s.connect(fl);fl.connect(g);g.connect(master);s.start()}catch(e){}}
/* Happy Birthday (giai điệu dân gian phổ cập) bằng tiếng chuông tổng hợp */
var HB=[[392,.75],[392,.25],[440,1],[392,1],[523.25,1],[493.88,2],
 [392,.75],[392,.25],[440,1],[392,1],[587.33,1],[523.25,2],
 [392,.75],[392,.25],[783.99,1],[659.25,1],[523.25,1],[493.88,1],[440,2],
 [698.46,.75],[698.46,.25],[659.25,1],[523.25,1],[587.33,1],[523.25,3]];
var BEAT=.62,HBLEN=0;HB.forEach(function(n){HBLEN+=n[1]});
function playHB(t0){
  if(!musicOn||!ac)return;
  var t=t0;
  for(var i=0;i<HB.length;i++){tone(HB[i][0],t,Math.min(1.6,HB[i][1]*BEAT*1.5+.3),.2);t+=HB[i][1]*BEAT}
  [130.8,130.8,196,174.6,130.8].forEach(function(f,k){tone(f,t0+k*5.2*BEAT,2.2,.1,'sine')});
  var next=t0+HBLEN*BEAT+2.2;
  setTimeout(function(){playHB(next)},Math.max(200,(next-ac.currentTime-1)*1000));
}
function startMusic(){if(!ac||musicOn)return;try{ac.resume()}catch(e){}musicOn=true;playHB(ac.currentTime+.2)}
function setMuted(m){muted=m;if(master)master.gain.setTargetAtTime(m?0:.5,ac.currentTime,.05);$('snd').textContent=m?'🔇':'🔊'}

/* ================= TRÒ CHƠI ================= */
var state='idle',wrong=0,target=rnd3(),lastTouch=Date.now(),hinted=false;
if(DBG&&+q.get('target'))target=+q.get('target');
var hitsG=$('hits'),flameIn=$('flameG').firstChild,tgt={x:0,y:0},wickP={x:0,y:0};
['candle:circle','wick:circle','flame:circle','cakeHit:rect'].forEach(function(s){var p=s.split(':');el(p[1],{'data-h':p[0],class:'hs'},hitsG)});
var hCandle=hitsG.querySelector('[data-h=candle]'),hWick=hitsG.querySelector('[data-h=wick]'),hFlame=hitsG.querySelector('[data-h=flame]'),hCake=hitsG.querySelector('[data-h=cakeHit]');
function setActive(names){var hs=document.querySelectorAll('[data-h]');for(var i=0;i<hs.length;i++)hs[i].classList.toggle('on',names.indexOf(hs[i].getAttribute('data-h'))>=0)}
function touch(){lastTouch=Date.now();if(hinted){hinted=false;say('')}}

async function begin(){

  for(var i=0;i<3;i++){boxes[i].wrap.animate([{opacity:0,transform:'translateY(16px)'},{opacity:1,transform:'translateY(0px)'}],{duration:700,fill:'forwards',easing:'ease-out'});chime(523+i*130);await sleep(450)}

  $('riddle').textContent=T[lang].q;$('riddle').classList.add('on');
  await sleep(1300);
  state='pick';setActive(['b1','b2','b3']);touch();
}
function pick(i){
  state='busy';setActive([]);say('');
  var ok=wrong>=6||i===target;
  if(ok)return reveal(i);
  wrong++;target=rnd3();return openEmpty(i)}
async function openEmpty(i){
  var b=boxes[i-1];b.body.style.opacity=1;chime(300);
  await anim(b.lid,[{transform:'translate(0px,0px) rotate(0deg)'},{transform:'translate(-6px,-58px) rotate(-16deg)'}],{duration:480,easing:'ease-out'});
  say(T[lang].wrong);
  await sleep(1700);
  await anim(b.lid,[{transform:'translate(-6px,-58px) rotate(-16deg)'},{transform:'translate(0px,0px) rotate(0deg)'}],{duration:420,easing:'ease-in'});

async function reveal(i){

  burst(BX[i-1],BY-60,'#ffe9a0',18);

  boxes.forEach(function(o,k){if(k!==i-1)o.wrap.animate([{opacity:1},{opacity:0}],{duration:900,fill:'forwards'})});
  var G=$('cakeG');G.style.transformOrigin='180px '+CAKE_B+'px';G.style.opacity=1;
  var dx=BX[i-1]-180,dy=BY-CAKE_B;
  await sleep(250);chime(523);
  await anim(G,[{transform:'translate('+dx+'px,'+dy+'px) scale(.18)',opacity:0},{transform:'translate('+(dx*.4)+'px,'+(dy*.4-30)+'px) scale(.7)',opacity:1,offset:.45},{transform:'translate(0px,-8px) scale(1.04)',opacity:1,offset:.82},{transform:'translate(0px,0px) scale(1)',opacity:1}],{duration:1700,easing:'ease-in-out'});
  chime(659);burst(180,cake.top+40,'#fff0b0',16);
  b.wrap.animate([{opacity:1},{opacity:0}],{duration:900,fill:'forwards'});
  /* nến nằm ở góc dưới bên phải bàn */
  candleG.setAttribute('transform','translate('+candleStart.x+' '+candleStart.y+') rotate(14)');
  candleG.style.opacity=0;await anim(candleG,[{opacity:0},{opacity:1}],{duration:900});
  hCandle.setAttribute('cx',candleStart.x-10);hCandle.setAttribute('cy',candleStart.y-48);hCandle.setAttribute('r',46);
  state='candle';hinted=false;setActive(['candle']);touch();
}
async function flyCandle(){
  state='fly';setActive([]);touch();chime(784);
  var t=candleTarget();tgt=t;
  var a=candleG.animate([
    {transform:'translate('+candleStart.x+'px,'+candleStart.y+'px) rotate(14deg) scale(1)'},
    {transform:'translate('+(candleStart.x-40)+'px,'+(candleStart.y-120)+'px) rotate(-8deg) scale(1.15)',offset:.3},
    {transform:'translate('+((candleStart.x+t.x)/2-20)+'px,'+(t.y-120)+'px) rotate(-14deg) scale(1.2)',offset:.65},
    {transform:'translate('+t.x+'px,'+(t.y-10)+'px) rotate(0deg) scale(1)',offset:.9},
    {transform:'translate('+t.x+'px,'+t.y+'px) rotate(0deg) scale(1)'}],{duration:1500,easing:'ease-in-out',fill:'forwards'});
  var iv=setInterval(function(){var r=candleG.getBoundingClientRect(),p=svg.createSVGPoint();p.x=r.left+r.width*.5;p.y=r.top+r.height*.15;var s=p.matrixTransform(svg.getScreenCTM().inverse());burst(s.x,s.y,'#fff4b0',3)},120);
  await a.finished;clearInterval(iv);
  candleG.setAttribute('transform','translate('+t.x+' '+t.y+')');a.cancel();
  cndIn.animate([{transform:'scaleY(1)'},{transform:'scaleY(.93)'},{transform:'scaleY(1)'}],{duration:320});
  chime(523);burst(t.x,t.y,'#ffe9a0',12);
  wickP={x:t.x+CANDLE_W*.04,y:t.y-CANDLE_H};
  hWick.setAttribute('cx',wickP.x);hWick.setAttribute('cy',wickP.y-4);hWick.setAttribute('r',28);
  state='wick';hinted=false;setActive(['wick']);touch();
}
async function lightWick(){
  state='lit';setActive([]);touch();
  noise(.12,1500);chime(880);
  $('flameG').setAttribute('transform','translate('+wickP.x+' '+(wickP.y+1)+')');
  flameIn.style.transformOrigin='0px 0px';
  $('flameG').style.opacity=1;
  flameIn.animate([{transform:'scale(0)'},{transform:'scale(1.3)',offset:.5},{transform:'scale(1)'}],{duration:700,easing:'ease-out'});
  $('dim').style.opacity=.55;$('stage').classList.add('night');$('glow').setAttribute('cx',wickP.x);$('glow').setAttribute('cy',wickP.y-8);$('glow').style.opacity=1;
  $('twk').style.display='none';
  burst(wickP.x,wickP.y-8,'#ffd27a',10);
  await sleep(1400);
  say(T[lang].blow);
  hFlame.setAttribute('cx',wickP.x);hFlame.setAttribute('cy',wickP.y-10);hFlame.setAttribute('r',42);
  hCake.setAttribute('x',cake.cx-CAKE_W/2);hCake.setAttribute('y',cake.top);hCake.setAttribute('width',CAKE_W);hCake.setAttribute('height',cake.h);
  state='blow';setActive(['flame','cakeHit','wick']);startMic();
}
/* thổi nến bằng micro (âm thanh bất kỳ đủ lớn hơn nền) hoặc chạm vào ngọn lửa */
var mic={stream:null,an:null,buf:null,base:0,hit:0,t0:0};
function startMic(){
  if(!ac||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)return;
  navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}}).then(function(s){
    if(state!=='blow'){s.getTracks().forEach(function(t){t.stop()});return}
    mic.stream=s;try{ac.resume()}catch(e){}
    var src=ac.createMediaStreamSource(s);mic.an=ac.createAnalyser();mic.an.fftSize=1024;src.connect(mic.an);
    mic.buf=new Float32Array(mic.an.fftSize);mic.base=0;mic.hit=0;mic.t0=performance.now();
    (function loop(){
      if(!mic.an||state!=='blow')return;
      mic.an.getFloatTimeDomainData(mic.buf);var sum=0,n=mic.buf.length;for(var i=0;i<n;i++)sum+=mic.buf[i]*mic.buf[i];var rms=Math.sqrt(sum/n);
      if(performance.now()-mic.t0<700){mic.base=Math.max(mic.base,rms)}
      else{
        var th=Math.max(.04,mic.base*3);
        flameIn.style.transform='rotate('+Math.min(22,Math.max(0,(rms-mic.base)/th*14))+'deg)';
        if(rms>th){mic.hit++;if(mic.hit>=5)return blowOut()}else mic.hit=Math.max(0,mic.hit-1);
      }
      requestAnimationFrame(loop)})();
  }).catch(function(){});
}
function stopMic(){try{if(mic.stream)mic.stream.getTracks().forEach(function(t){t.stop()})}catch(e){}mic.stream=null;mic.an=null}
async function blowOut(){
  if(state!=='blow')return;
  state='out';stopMic();setActive([]);say('');
  noise(.35,900);chime(330);
  $('flameG').animate([{opacity:1},{opacity:0}],{duration:420,fill:'forwards'});
  for(var k=0;k<3;k++){(function(k){var p=el('path',{d:'M0,0 C-6,-12 6,-22 0,-36 C-5,-46 4,-52 0,-62',fill:'none',stroke:'#d9d3df','stroke-width':2.2,'stroke-linecap':'round',opacity:0,transform:'translate('+(wickP.x+(k-1)*4)+' '+(wickP.y-4)+')'},$('smokeG'));
    p.animate([{opacity:0,transform:'translate('+(wickP.x+(k-1)*4)+'px,'+(wickP.y-4)+'px) scale(.6)'},{opacity:.75,offset:.3},{opacity:0,transform:'translate('+(wickP.x+(k-1)*10)+'px,'+(wickP.y-34)+'px) scale(1.15)'}],{duration:1700,delay:k*220,easing:'ease-out',fill:'forwards'})})(k)}
  $('dim').style.opacity=0;$('glow').style.opacity=0;$('stage').classList.remove('night');
  await sleep(1500);
  showCard();
}
function showCard(){
  state='done';var t=T[lang];
  $('cardBg').src='assets/card'+frame+'.webp';
  var ex=(lang==='ja'||lang==='zh'||lang==='zh-TW')?'！':'!';
  var nm=(nameTo||t.anon),L=Array.from(nm).length;
  $('hb').textContent=t.hb;$('nm').textContent=nm+ex;
  $('nm').style.fontSize=Math.max(5.2,Math.min(9.4,9.4*13/(L+1)))+'cqw';
  $('cmsg').textContent=custom;$('cmsg').style.display=custom?'block':'none';
  $('csign').textContent=nameFrom?fmt(t.sign):'';$('csign').style.display=nameFrom?'block':'none';
  $('replay').textContent=t.replay;$('dlT').textContent=t.dl;$('dlA').textContent=PLAY;$('dlA').href=PLAY;
  $('snd').style.display='block';
  startMusic();
  svg.style.opacity=0;$('card').classList.add('on');
}
/* quay lại màn chọn hộp (không ai chạm quá lâu) */
async function resetToPick(){
  state='busy';setActive([]);say('');stopMic();
  $('veil').classList.remove('off');
  await sleep(2700);
  [$('cakeG'),candleG,$('flameG')].forEach(function(n){n.getAnimations().forEach(function(a){a.cancel()});n.style.opacity=0});
  candleG.removeAttribute('transform');$('twk').style.display='';$('smokeG').innerHTML='';$('stage').classList.remove('night');$('dim').style.opacity=0;$('glow').style.opacity=0;
  boxes.forEach(function(b){[b.lid,b.wrap].forEach(function(n){n.getAnimations().forEach(function(a){a.cancel()})});b.body.style.opacity=1;b.wrap.style.opacity=1});
  wrong=0;target=rnd3();hinted=false;$('riddle').classList.add('on');
  await sleep(200);$('veil').classList.add('off');await sleep(1800);
  state='pick';setActive(['b1','b2','b3']);touch();
}
setInterval(function(){
  if(state!=='candle'&&state!=='wick')return;
  var idle=(Date.now()-lastTouch)/1000;
  if(idle>=T_RESET){resetToPick();return}
  if(idle>=T_HINT&&!hinted){hinted=true;say(state==='candle'?T[lang].hintCandle:T[lang].hintWick)}
},1000);

/* ================= INPUT: chạm + chống ăn gian (nhiều ngón) ================= */
var down={},gMax=0,gTarget=null,gBox=false,gT=0;
function hitOf(e){var n=e.target&&e.target.closest?e.target.closest('[data-h]'):null;return n?n.getAttribute('data-h'):null}
var cheatT=null;
function cheat(){
  var c=$('cheat');c.querySelector('.t').textContent=T[lang].cheat;c.classList.add('on');
  noise(.1,300);clearTimeout(cheatT);cheatT=setTimeout(function(){c.classList.remove('on')},2300)}
$('stage').addEventListener('pointerdown',function(e){
  if(e.target.closest&&e.target.closest('button,a,input,select,label,#start'))return;
  e.preventDefault();touch();
  if(Date.now()-gT>3000){down={};gMax=0}
  gT=Date.now();
  down[e.pointerId]=1;var n=Object.keys(down).length;
  if(n===1){gMax=1;gTarget=hitOf(e);gBox=/^b[123]$/.test(gTarget||'')}
  else{gMax=Math.max(gMax,n);if(/^b[123]$/.test(hitOf(e)||''))gBox=true}
});
function up(e){
  if(!down[e.pointerId])return;delete down[e.pointerId];
  if(Object.keys(down).length)return;
  var h=gTarget,multi=gMax>=2,box=gBox;gMax=0;gTarget=null;gBox=false;
  if(multi){if(state==='pick'&&box)cheat();return}
  if(!h)return;
  if(state==='pick'&&/^b[123]$/.test(h))pick(+h[1]);
  else if(state==='candle'&&h==='candle')flyCandle();
  else if(state==='wick'&&h==='wick')lightWick();
  else if(state==='blow'&&(h==='flame'||h==='cakeHit'||h==='wick'))blowOut();
}
window.addEventListener('pointerup',up);window.addEventListener('pointercancel',function(e){delete down[e.pointerId];if(!Object.keys(down).length){gMax=0;gTarget=null;gBox=false}});
$('snd').addEventListener('click',function(){setMuted(!muted)});
$('replay').addEventListener('click',function(){location.reload()});

  var t=T[lang];

}

$('openBtn').addEventListener('click',function(){
  if(!hasParams){try{localStorage.setItem('birthdayDemo',JSON.stringify({to:nameTo,from:nameFrom,msg:custom,lang:lang}))}catch(e){}}
  initAudio();if(ac){try{ac.resume()}catch(e){}}

});
if(DBG)window.__bd={get state(){return state},get wrong(){return wrong},get target(){return target},set target(v){target=v},pick:pick,hit:function(h){return hitOf({target:document.querySelector('[data-h='+h+']')})}};
})();
